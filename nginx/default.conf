server {
    listen 80;
    server_name _;

    # 참고: 아래 location은 Nginx 문법으로 "주소 경로별 처리 규칙"을 뜻합니다.
    # 맵 기능의 장소(locations) API와는 관계없습니다.

    # 백엔드(FastAPI)로 넘길 때 원래 요청 정보를 함께 전달합니다.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 프론트 화면(빌드 결과)을 보여 줍니다.
    # 화면 주소(/trainers/elesa 등)에서 새로고침해도 index.html을 주어 React가 화면을 그리게 합니다.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # 기능 API: /api/... 요청을 FastAPI로 넘깁니다.
    location /api/ {
        proxy_pass http://backend:8000;
    }

    # Swagger 화면과, 화면이 불러오는 API 명세 파일
    location = /docs {
        proxy_pass http://backend:8000;
    }

    location = /openapi.json {
        proxy_pass http://backend:8000;
    }

    # 서버 상태 확인
    location = /health {
        proxy_pass http://backend:8000;
    }
}
