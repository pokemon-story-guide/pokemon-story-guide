name: Algorithm Tests
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  algorithm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test generation five type matchups
        run: python -m unittest discover -s tests -p 'test_type_chart.py' -v
