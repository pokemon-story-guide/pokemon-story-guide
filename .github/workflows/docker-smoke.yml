name: Docker Compose Smoke Test
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      available: ${{ steps.compose.outputs.available }}
    steps:
      - uses: actions/checkout@v7
      - name: Check whether the Docker configuration has been merged
        id: compose
        run: |
          if [ -f docker-compose.yml ] && [ -f backend/Dockerfile ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Docker test skipped: merge the Docker configuration PR first." >> "$GITHUB_STEP_SUMMARY"
          fi
  smoke:
    needs: configuration
    if: needs.configuration.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start services
        run: docker compose up --build --wait --wait-timeout 90
      - name: Test backend container connection to Redis
        run: |
          docker compose exec -T backend python - <<'PY'
          import socket
          with socket.create_connection(("redis", 6379), timeout=5) as connection:
              connection.sendall(b"*1\r\n$4\r\nPING\r\n")
              response = connection.makefile("rb").readline()
              assert response == b"+PONG\r\n", response
          PY
      - name: Test container API
        run: |
          docker compose exec -T backend python - <<'PY'
          import json
          import time
          from urllib.request import urlopen

          def get_json(path):
              with urlopen(f"http://127.0.0.1:8000{path}", timeout=3) as response:
                  assert response.status == 200
                  return json.load(response)

          for attempt in range(30):
              try:
                  assert get_json("/health") == {"status": "ok"}
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(1)

          locations = get_json("/api/locations")
          assert locations and all({"id", "name"} <= set(row) for row in locations)
          for location in locations:
              pokemon = get_json(f"/api/locations/{location['id']}/pokemon")
              assert isinstance(pokemon, list)
          PY
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services and remove CI volumes
        if: always()
        run: docker compose down --volumes
