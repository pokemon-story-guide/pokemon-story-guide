name: Python Code Quality
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install ruff==0.14.4
      - name: Check syntax and common Python mistakes
        run: ruff check --select E9,F backend
